<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>장소 아카이브</title>
  <meta name="theme-color" content="#132440" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="view-list">
  <header class="app-header" id="appHeader">
    <div class="header-top">
      <h1 class="logo">장소 아카이브</h1>
      <div class="header-actions">
        <button class="icon-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="메뉴">⋯</button>
        <div class="menu" id="menu" hidden>
          <button data-menu="export">JSON 내보내기</button>
          <button data-menu="import">JSON 가져오기</button>
          <button data-menu="reset" class="danger">브라우저 변경사항 초기화</button>
        </div>
      </div>
    </div>

    <div class="search-row">
      <input type="search" id="searchInput" placeholder="장소명, 메모, 태그 검색" autocomplete="off" />
      <select id="sortSelect" aria-label="정렬">
        <option value="recent">최근 추가순</option>
        <option value="name">이름순</option>
        <option value="region">지역순</option>
      </select>
    </div>

    <div class="filter-group">
      <div class="seg" id="visitedSeg" role="tablist" aria-label="방문 여부">
        <button data-visited="all" class="active">전체</button>
        <button data-visited="todo">가볼 곳</button>
        <button data-visited="done">가본 곳</button>
      </div>
      <div class="chips" id="regionChips" aria-label="지역"></div>
      <div class="chips" id="categoryChips" aria-label="카테고리"></div>
    </div>

    <div class="status-row">
      <span id="resultCount"></span>
      <span id="dirtyBadge" class="dirty" hidden></span>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main class="layout">
    <section class="list-pane" id="listPane">
      <ul class="cards" id="cardList"></ul>
      <p class="empty" id="emptyMsg" hidden>조건에 맞는 장소가 없어요.</p>
    </section>
    <section class="map-pane" id="mapPane">
      <div id="map"></div>
    </section>
  </main>

  <nav class="view-toggle" aria-label="보기 전환">
    <button data-view="list" class="active">목록</button>
    <button data-view="map">지도</button>
  </nav>

  <button class="fab" id="addBtn" aria-label="장소 추가">＋</button>

  <dialog id="placeDialog">
    <form id="placeForm" method="dialog">
      <h2 id="dialogTitle">장소 추가</h2>

      <label>장소명 *<input name="name" required /></label>

      <div class="form-row">
        <label>지역 *<input name="region" list="regionList" required placeholder="예: 경기" /></label>
        <label>세부지역<input name="sub_region" placeholder="예: 안산 대부도" /></label>
      </div>
      <datalist id="regionList"></datalist>

      <label>카테고리 *
        <select name="category" required id="categorySelect"></select>
      </label>

      <label>태그 <small>쉼표로 구분</small><input name="tags" placeholder="오션뷰, 드라이브" /></label>
      <label>메모 (저장한 이유)<textarea name="memo" rows="2"></textarea></label>
      <label>카카오맵 URL<input name="kakaomap_url" type="url" placeholder="https://place.map.kakao.com/..." /></label>
      <label>인스타그램 URL<input name="instagram_url" type="url" placeholder="https://www.instagram.com/p/..." /></label>

      <div class="form-row">
        <label>위도<input name="lat" type="number" step="any" placeholder="37.24" /></label>
        <label>경도<input name="lng" type="number" step="any" placeholder="126.57" /></label>
      </div>
      <p class="hint">좌표가 있어야 지도에 표시돼요. 카카오맵에서 장소를 우클릭 → ‘이 위치의 좌표’ 등으로 확인할 수 있어요.</p>

      <label class="check"><input type="checkbox" name="visited" /> 가본 곳</label>

      <div class="dialog-actions">
        <button type="button" value="cancel" id="cancelBtn" class="ghost">취소</button>
        <button type="submit" value="save" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importInput" accept="application/json,.json" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
